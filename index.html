  <!-- ==================== TAMPILAN / CSS ==================== -->
  <style>
@import "tailwindcss";

:root {
  --navy-950: #101d3d;
  --navy-900: #16264f;
  --navy-800: #1b3470;
  --navy-700: #244794;
  --gold-500: #c18a3d;
  --gold-400: #d7a65b;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-soft: #f7f8fb;
  --surface-strong: #eef1f6;
  --text: #172033;
  --text-soft: #5f6b7e;
  --text-faint: #8791a2;
  --border: #dfe4ec;
  --border-strong: #ced5e0;
  --primary: #1b3470;
  --primary-hover: #14285a;
  --primary-soft: #edf2ff;
  --gold-soft: #f8f0e3;
  --success: #197145;
  --success-soft: #eaf7f0;
  --danger: #b53a3a;
  --danger-hover: #982e2e;
  --danger-soft: #fff0f0;
  --warning: #946320;
  --warning-soft: #fff7e7;
  --shadow-sm: 0 1px 2px rgba(16, 29, 61, 0.04);
  --shadow-md: 0 12px 34px rgba(16, 29, 61, 0.08);
  --sidebar-width: 270px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

html[data-theme="dark"] {
  --bg: #0e1420;
  --surface: #151d2b;
  --surface-raised: #192231;
  --surface-soft: #1b2535;
  --surface-strong: #212c3d;
  --text: #edf1f7;
  --text-soft: #a4afbf;
  --text-faint: #7f8b9c;
  --border: #293649;
  --border-strong: #35445a;
  --primary: #6f95e7;
  --primary-hover: #86a8ed;
  --primary-soft: #1d2b48;
  --gold-soft: #322818;
  --success: #59c48b;
  --success-soft: #183528;
  --danger: #f07d7d;
  --danger-hover: #f29898;
  --danger-soft: #3a2024;
  --warning: #e6b66d;
  --warning-soft: #372b19;
  --shadow-md: 0 18px 44px rgba(0, 0, 0, 0.22);
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  color-scheme: light;
  background: var(--bg);
}

html[data-theme="dark"] {
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI Variable", "Segoe UI", Inter, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background 180ms ease, color 180ms ease;
}

button,
input,
select {
  font: inherit;
}

button {
  color: inherit;
}

button,
select {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

::selection {
  color: white;
  background: var(--navy-700);
}

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
  outline-offset: 2px;
}

.mono {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

.spin {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.brand-logo-frame {
  width: 188px;
  padding: 7px 10px;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.28);
  border-radius: 12px;
  background: #ffffff;
  box-shadow: 0 8px 20px rgba(16, 29, 61, 0.12);
}

.brand-logo {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.brand-mark {
  position: relative;
  width: 48px;
  height: 48px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  place-items: center;
  overflow: hidden;
  border-radius: 13px;
  color: white;
  background: var(--navy-900);
  box-shadow: 0 8px 20px rgba(16, 29, 61, 0.18);
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 4px;
  background: var(--gold-500);
}

.brand-mark span {
  position: relative;
  z-index: 1;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.05em;
}

.brand-mark span + span {
  color: #f0c67e;
}

.brand-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 2px;
}

.brand-copy strong {
  overflow: hidden;
  color: var(--text);
  font-size: 15px;
  font-weight: 750;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-copy span {
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.brand--compact .brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 11px;
}

.brand--compact .brand-logo-frame {
  width: 156px;
}

.icon-button {
  width: 40px;
  height: 40px;
  display: inline-grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-soft);
  background: var(--surface);
  transition: 150ms ease;
}

.icon-button:hover {
  color: var(--text);
  border-color: var(--border-strong);
  background: var(--surface-soft);
  transform: translateY(-1px);
}

.primary-button,
.secondary-button,
.danger-button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 10px;
  padding: 0 16px;
  font-size: 13px;
  font-weight: 720;
  transition: 150ms ease;
}

.primary-button {
  border: 1px solid var(--navy-800);
  color: white;
  background: var(--navy-800);
  box-shadow: 0 7px 18px rgba(27, 52, 112, 0.18);
}

.primary-button:hover:not(:disabled) {
  border-color: var(--navy-950);
  background: var(--navy-950);
  transform: translateY(-1px);
}

.secondary-button {
  border: 1px solid var(--border);
  color: var(--text-soft);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.secondary-button:hover:not(:disabled) {
  color: var(--primary);
  border-color: color-mix(in srgb, var(--primary) 42%, var(--border));
  background: var(--primary-soft);
}

.danger-button {
  border: 1px solid var(--danger);
  color: white;
  background: var(--danger);
}

.danger-button:hover:not(:disabled) {
  background: var(--danger-hover);
  transform: translateY(-1px);
}

.primary-button:disabled,
.secondary-button:disabled,
.danger-button:disabled {
  opacity: 0.48;
  box-shadow: none;
}

.splash-screen {
  min-height: 100vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 22px;
  background:
    radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--primary-soft) 80%, transparent), transparent 34%),
    var(--bg);
}

.splash-screen p {
  margin: -8px 0 0;
  color: var(--text-faint);
  font-size: 12px;
}

.splash-loader {
  display: flex;
  gap: 5px;
}

.splash-loader span {
  width: 5px;
  height: 5px;
  border-radius: 99px;
  background: var(--gold-500);
  animation: splashPulse 1s ease-in-out infinite;
}

.splash-loader span:nth-child(2) { animation-delay: 0.12s; }
.splash-loader span:nth-child(3) { animation-delay: 0.24s; }

@keyframes splashPulse {
  0%, 100% { opacity: 0.25; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

/* Login */
.login-page {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  padding: 28px clamp(22px, 5vw, 72px) 20px;
  background:
    linear-gradient(120deg, color-mix(in srgb, var(--primary-soft) 72%, transparent), transparent 44%),
    var(--bg);
}

.login-page::before {
  content: "";
  position: absolute;
  width: 460px;
  height: 460px;
  right: -210px;
  bottom: -220px;
  border: 1px solid color-mix(in srgb, var(--gold-500) 28%, transparent);
  border-radius: 50%;
  box-shadow:
    0 0 0 58px color-mix(in srgb, var(--gold-500) 4%, transparent),
    0 0 0 116px color-mix(in srgb, var(--gold-500) 3%, transparent);
  pointer-events: none;
}

.login-topbar {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.login-layout {
  position: relative;
  z-index: 2;
  width: min(1120px, 100%);
  min-height: calc(100vh - 160px);
  margin: 18px auto 0;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.72fr);
  align-items: center;
  gap: clamp(50px, 8vw, 112px);
}

.login-intro {
  max-width: 640px;
  animation: rise 500ms ease both;
}

.intro-kicker,
.secure-badge,
.admin-badge {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid color-mix(in srgb, var(--gold-500) 28%, var(--border));
  border-radius: 999px;
  padding: 7px 11px;
  color: var(--warning);
  background: var(--gold-soft);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.login-intro h1 {
  max-width: 620px;
  margin: 24px 0 18px;
  color: var(--text);
  font-size: clamp(40px, 5vw, 64px);
  font-weight: 780;
  letter-spacing: -0.055em;
  line-height: 1.06;
}

.login-intro > p {
  max-width: 560px;
  margin: 0;
  color: var(--text-soft);
  font-size: 17px;
  line-height: 1.75;
}

.login-benefits {
  margin-top: 38px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.login-benefits > div {
  display: flex;
  align-items: flex-start;
  gap: 11px;
}

.login-benefits > div > span {
  width: 36px;
  height: 36px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.login-benefits strong,
.login-benefits small {
  display: block;
}

.login-benefits strong {
  margin: 1px 0 4px;
  font-size: 12px;
}

.login-benefits small {
  color: var(--text-faint);
  font-size: 10.5px;
  line-height: 1.5;
}

.login-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: clamp(27px, 4vw, 42px);
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  box-shadow: var(--shadow-md);
  animation: rise 500ms 80ms ease both;
}

.login-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--navy-700), var(--gold-500));
}

.login-card-head h2 {
  margin: 22px 0 7px;
  font-size: 27px;
  letter-spacing: -0.035em;
}

.login-card-head p {
  margin: 0 0 25px;
  color: var(--text-soft);
  font-size: 13px;
}

.login-form {
  display: grid;
  gap: 17px;
}

.login-form label > span,
.field-grid label > span,
.mapping-grid label > span,
.grant-fields label > span {
  display: block;
  margin-bottom: 7px;
  color: var(--text-soft);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.input-shell,
.select-shell,
.grant-fields input,
.grant-fields select,
.mapping-grid select {
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 13px;
  color: var(--text-soft);
  background: var(--surface-soft);
  transition: 150ms ease;
}

.input-shell:focus-within,
.select-shell:focus-within,
.grant-fields input:focus,
.grant-fields select:focus,
.mapping-grid select:focus {
  color: var(--primary);
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent);
}

.input-shell input,
.select-shell select {
  width: 100%;
  min-width: 0;
  align-self: stretch;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  font-size: 13.5px;
}

.input-shell input::placeholder {
  color: var(--text-faint);
}

.password-toggle {
  width: 32px;
  height: 32px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 0;
  border-radius: 8px;
  color: var(--text-faint);
  background: transparent;
}

.password-toggle:hover {
  color: var(--text);
  background: var(--surface-strong);
}

.login-submit {
  width: 100%;
  min-height: 48px;
  margin-top: 4px;
  justify-content: space-between;
  padding: 0 18px;
}

.login-footnote {
  margin: 21px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: var(--text-faint);
  font-size: 10.5px;
}

.login-footer {
  position: relative;
  z-index: 2;
  width: min(1200px, 100%);
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  color: var(--text-faint);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
}

.alert {
  margin-bottom: 18px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border: 1px solid;
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 12px;
  line-height: 1.5;
}

.alert svg {
  flex: 0 0 auto;
  margin-top: 1px;
}

.alert--error {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 30%, var(--border));
  background: var(--danger-soft);
}

.compact-alert {
  margin: 14px 0 0;
}

/* Workspace */
.workspace {
  min-height: 100vh;
  background: var(--bg);
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 40;
  width: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--surface);
  transition: transform 220ms ease;
}

.sidebar-brand-row {
  min-height: 86px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-close {
  display: none;
  border: 0;
  background: transparent;
}

.sidebar-context {
  margin: 18px 16px 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  background: var(--surface-soft);
}

.context-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #37a56c;
  box-shadow: 0 0 0 4px color-mix(in srgb, #37a56c 14%, transparent);
}

.sidebar-context div {
  min-width: 0;
}

.sidebar-context small,
.sidebar-context strong {
  display: block;
}

.sidebar-context small {
  margin-bottom: 2px;
  color: var(--text-faint);
  font-size: 9px;
  text-transform: uppercase;
}

.sidebar-context strong {
  overflow: hidden;
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.side-nav {
  padding: 17px 12px;
  display: grid;
  gap: 5px;
}

.nav-caption {
  padding: 0 11px 8px;
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 750;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.side-nav button {
  position: relative;
  min-height: 46px;
  display: flex;
  align-items: center;
  gap: 11px;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0 12px;
  color: var(--text-soft);
  background: transparent;
  font-size: 12.5px;
  font-weight: 650;
  text-align: left;
  transition: 150ms ease;
}

.side-nav button:hover {
  color: var(--text);
  background: var(--surface-soft);
}

.side-nav button.active {
  color: var(--primary);
  border-color: color-mix(in srgb, var(--primary) 12%, var(--border));
  background: var(--primary-soft);
}

.side-nav button.active::before {
  content: "";
  position: absolute;
  left: -12px;
  width: 3px;
  height: 24px;
  border-radius: 0 3px 3px 0;
  background: var(--gold-500);
}

.nav-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
}

.nav-arrow {
  margin-left: auto;
  opacity: 0.65;
}

.sidebar-meta {
  margin: auto 16px 14px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  color: var(--text-faint);
  background: var(--surface-soft);
}

.sidebar-meta svg {
  flex: 0 0 auto;
  margin-top: 1px;
}

.sidebar-meta small,
.sidebar-meta strong {
  display: block;
}

.sidebar-meta small {
  margin-bottom: 3px;
  font-size: 9px;
}

.sidebar-meta strong {
  color: var(--text-soft);
  font-size: 9.5px;
  line-height: 1.45;
}

.sidebar-footer {
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.sidebar-user-avatar,
.access-avatar {
  width: 36px;
  height: 36px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: var(--navy-800);
  font-size: 11px;
  font-weight: 800;
}

.sidebar-user-copy {
  min-width: 0;
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
}

.sidebar-user-copy strong {
  overflow: hidden;
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-user-copy span {
  color: var(--text-faint);
  font-size: 9.5px;
}

.sidebar-footer > button {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  color: var(--text-faint);
  background: transparent;
}

.sidebar-footer > button:hover {
  color: var(--danger);
  background: var(--danger-soft);
}

.main-area {
  min-height: 100vh;
  margin-left: var(--sidebar-width);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(22px, 4vw, 48px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
}

.topbar-left,
.topbar-actions {
  display: flex;
  align-items: center;
}

.topbar-actions {
  gap: 9px;
}

.menu-button,
.mobile-title {
  display: none;
}

.role-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 10px;
  color: var(--text-soft);
  background: var(--surface-soft);
  font-size: 10px;
  font-weight: 700;
}

.role-chip--admin {
  color: var(--warning);
  border-color: color-mix(in srgb, var(--gold-500) 25%, var(--border));
  background: var(--gold-soft);
}

.content-wrap {
  width: min(1260px, 100%);
  margin: 0 auto;
  padding: 34px clamp(22px, 4vw, 48px) 60px;
}

.content-wrap > section {
  animation: rise 220ms ease both;
}

.access-banner {
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid color-mix(in srgb, var(--primary) 20%, var(--border));
  border-radius: 12px;
  padding: 12px 14px;
  background: var(--primary-soft);
}

.access-banner-icon {
  width: 36px;
  height: 36px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  color: var(--primary);
  background: var(--surface);
}

.access-banner strong,
.access-banner span {
  display: block;
}

.access-banner strong {
  margin-bottom: 2px;
  font-size: 11px;
}

.access-banner span {
  color: var(--text-soft);
  font-size: 10.5px;
}

.section-heading {
  margin-bottom: 25px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}

.eyebrow {
  display: block;
  margin-bottom: 7px;
  color: var(--gold-500);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.section-heading h1 {
  margin: 0;
  color: var(--text);
  font-size: clamp(26px, 3.2vw, 36px);
  font-weight: 760;
  letter-spacing: -0.045em;
  line-height: 1.15;
}

.section-heading p {
  max-width: 650px;
  margin: 8px 0 0;
  color: var(--text-soft);
  font-size: 12.5px;
  line-height: 1.6;
}

.section-action {
  flex: 0 0 auto;
}

.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.search-panel {
  margin-bottom: 18px;
  padding: 22px;
}

.search-field-large {
  min-height: 60px;
  display: flex;
  align-items: center;
  gap: 13px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 0 16px;
  color: var(--text-faint);
  background: var(--surface-soft);
  transition: 150ms ease;
}

.search-field-large:focus-within {
  color: var(--primary);
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 10%, transparent);
}

.search-field-large input {
  width: 100%;
  align-self: stretch;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  font-size: 16px;
  font-weight: 520;
}

.search-field-large input::placeholder {
  color: var(--text-faint);
}

.search-field-large button {
  width: 34px;
  height: 34px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 0;
  border-radius: 8px;
  color: var(--text-faint);
  background: transparent;
}

.search-field-large button:hover {
  color: var(--text);
  background: var(--surface-strong);
}

.search-field-large kbd {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  color: var(--text-faint);
  background: var(--surface);
  font-family: inherit;
  font-size: 9px;
  font-weight: 650;
}

.search-help {
  margin-top: 12px;
  display: flex;
  gap: 20px;
  color: var(--text-faint);
  font-size: 10px;
}

.search-help span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.search-help svg {
  color: var(--success);
}

.result-panel {
  overflow: hidden;
}

.result-toolbar,
.panel-title {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  padding: 13px 17px 13px 20px;
}

.result-toolbar > div > strong,
.result-toolbar > div > span {
  display: block;
}

.result-toolbar > div > strong {
  margin-bottom: 3px;
  font-size: 12.5px;
}

.result-toolbar > div > span {
  color: var(--text-faint);
  font-size: 10px;
}

.data-table-scroll {
  max-height: 455px;
  overflow: auto;
}

.data-table {
  width: 100%;
  min-width: 900px;
  border-collapse: separate;
  border-spacing: 0;
}

.data-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom: 1px solid var(--border);
  padding: 11px 14px;
  color: var(--text-faint);
  background: var(--surface-soft);
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

.data-table td {
  border-bottom: 1px solid var(--border);
  padding: 13px 14px;
  color: var(--text);
  font-size: 10.5px;
  line-height: 1.45;
  white-space: nowrap;
}

.data-table tbody tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover td {
  background: color-mix(in srgb, var(--primary-soft) 45%, transparent);
}

.employee-nik {
  color: var(--primary);
  font-size: 10px;
  font-weight: 700;
}

.muted-cell {
  color: var(--text-soft);
}

.location-cell {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-soft);
}

.location-cell svg {
  color: var(--gold-500);
}

.room-token {
  min-width: 28px;
  display: inline-flex;
  justify-content: center;
  border: 1px solid;
  border-radius: 6px;
  padding: 4px 7px;
  font-weight: 750;
}

.room-token--block {
  color: var(--primary);
  border-color: color-mix(in srgb, var(--primary) 20%, var(--border));
  background: var(--primary-soft);
}

.room-token--room {
  color: var(--warning);
  border-color: color-mix(in srgb, var(--gold-500) 25%, var(--border));
  background: var(--gold-soft);
}

.empty-state,
.table-state {
  min-height: 235px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 32px;
  text-align: center;
}

.empty-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text-faint);
  background: var(--surface-soft);
}

.empty-state strong {
  margin-bottom: 5px;
  font-size: 12.5px;
}

.empty-state p {
  max-width: 390px;
  margin: 0;
  color: var(--text-faint);
  font-size: 10.5px;
  line-height: 1.55;
}

.table-state {
  gap: 10px;
  color: var(--text-faint);
  font-size: 11px;
}

/* Filter */
.filter-panel {
  margin-bottom: 18px;
  padding: 20px;
}

.field-grid--filter {
  display: grid;
  grid-template-columns: 1.5fr 0.7fr 0.8fr auto;
  align-items: end;
  gap: 12px;
}

.filter-submit {
  min-height: 46px;
  white-space: nowrap;
}

/* Upload */
.upload-stepper {
  width: min(650px, 100%);
  margin: 0 0 22px;
  display: grid;
  grid-template-columns: auto minmax(25px, 1fr) auto minmax(25px, 1fr) auto;
  align-items: center;
}

.upload-stepper > div {
  display: flex;
  align-items: center;
  gap: 9px;
  opacity: 0.45;
}

.upload-stepper > div.active,
.upload-stepper > div.done {
  opacity: 1;
}

.upload-stepper > div > span,
.step-number {
  width: 29px;
  height: 29px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-soft);
  background: var(--surface);
  font-size: 10px;
  font-weight: 800;
}

.upload-stepper > div.active > span {
  color: white;
  border-color: var(--navy-800);
  background: var(--navy-800);
}

.upload-stepper > div.done > span {
  color: var(--success);
  border-color: color-mix(in srgb, var(--success) 35%, var(--border));
  background: var(--success-soft);
}

.upload-stepper p {
  margin: 0;
}

.upload-stepper strong,
.upload-stepper small {
  display: block;
  white-space: nowrap;
}

.upload-stepper strong {
  margin-bottom: 2px;
  font-size: 10.5px;
}

.upload-stepper small {
  color: var(--text-faint);
  font-size: 8.5px;
}

.upload-stepper > i {
  height: 1px;
  margin: 0 12px;
  background: var(--border);
}

.upload-drop-panel {
  padding: 16px;
}

.upload-dropzone {
  width: 100%;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  border: 1.5px dashed var(--border-strong);
  border-radius: 13px;
  padding: 28px;
  background: var(--surface-soft);
  transition: 160ms ease;
}

.upload-dropzone:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.upload-illustration {
  width: 62px;
  height: 62px;
  margin-bottom: 17px;
  display: grid;
  place-items: center;
  border: 1px solid color-mix(in srgb, var(--primary) 18%, var(--border));
  border-radius: 17px;
  color: var(--primary);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.upload-dropzone > strong {
  font-size: 15px;
}

.upload-dropzone > p {
  max-width: 450px;
  margin: 8px 0 18px;
  color: var(--text-faint);
  font-size: 11px;
  line-height: 1.55;
}

.upload-dropzone .secondary-button {
  pointer-events: none;
}

.status-line {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text-soft);
  background: var(--surface-soft);
  font-size: 11px;
}

.status-line--success {
  color: var(--success);
  border-color: color-mix(in srgb, var(--success) 24%, var(--border));
  background: var(--success-soft);
}

.status-line--error {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 25%, var(--border));
  background: var(--danger-soft);
}

.upload-workflow {
  display: grid;
  gap: 15px;
}

.file-summary {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 16px;
}

.file-icon {
  width: 42px;
  height: 42px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid color-mix(in srgb, var(--success) 22%, var(--border));
  border-radius: 11px;
  color: var(--success);
  background: var(--success-soft);
}

.file-summary > div:nth-child(2) {
  min-width: 0;
  flex: 1;
}

.file-summary strong,
.file-summary span {
  display: block;
}

.file-summary strong {
  overflow: hidden;
  margin-bottom: 3px;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-summary span {
  color: var(--text-faint);
  font-size: 9.5px;
}

.mapping-panel {
  padding-bottom: 18px;
}

.panel-title {
  margin-bottom: 18px;
}

.panel-title > div {
  display: flex;
  align-items: center;
  gap: 11px;
}

.panel-title > div > div strong,
.panel-title > div > div p {
  display: block;
}

.panel-title > div > div strong {
  font-size: 12.5px;
}

.panel-title > div > div p {
  margin: 3px 0 0;
  color: var(--text-faint);
  font-size: 9.5px;
}

.panel-title.simple {
  margin-bottom: 0;
}

.mapping-ok,
.mapping-pending {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 5px 8px;
  font-size: 9px;
  font-weight: 700;
}

.mapping-ok {
  color: var(--success);
  background: var(--success-soft);
}

.mapping-pending {
  color: var(--warning);
  background: var(--warning-soft);
}

.mapping-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
  padding: 0 20px;
}

.mapping-grid select,
.grant-fields input,
.grant-fields select {
  width: 100%;
  outline: 0;
  color: var(--text);
  font-size: 11px;
}

.preview-panel {
  overflow: hidden;
}

.preview-count {
  border-radius: 999px;
  padding: 6px 9px;
  color: var(--success);
  background: var(--success-soft);
  font-size: 9.5px;
  font-weight: 700;
}

.duplicate-box {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px solid color-mix(in srgb, var(--warning) 26%, var(--border));
  border-radius: 13px;
  padding: 15px;
  color: var(--warning);
  background: var(--warning-soft);
}

.duplicate-icon {
  width: 36px;
  height: 36px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  background: color-mix(in srgb, var(--warning) 10%, var(--surface));
}

.duplicate-box strong {
  font-size: 11.5px;
}

.duplicate-box p {
  margin: 4px 0 10px;
  font-size: 9.5px;
  line-height: 1.6;
}

.check-row,
.confirm-row {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.check-row input,
.confirm-row input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.check-row > span,
.confirm-row > span {
  width: 18px;
  height: 18px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  color: transparent;
  background: var(--surface);
}

.check-row input:checked + span,
.confirm-row input:checked + span {
  color: white;
  border-color: var(--primary);
  background: var(--primary);
}

.check-row {
  font-size: 10px;
  font-weight: 650;
}

.confirmation-panel {
  overflow: hidden;
}

.danger-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}

.danger-heading > span {
  width: 40px;
  height: 40px;
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  color: var(--danger);
  background: var(--danger-soft);
}

.danger-heading strong {
  font-size: 12.5px;
}

.danger-heading p {
  margin: 4px 0 0;
  color: var(--text-faint);
  font-size: 9.5px;
}

.replace-summary {
  margin: 18px 20px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 26px;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 14px;
  background: var(--surface-soft);
}

.replace-summary svg {
  color: var(--text-faint);
}

.replace-summary div {
  text-align: center;
}

.replace-summary small,
.replace-summary strong {
  display: block;
}

.replace-summary small {
  margin-bottom: 4px;
  color: var(--text-faint);
  font-size: 8.5px;
  text-transform: uppercase;
}

.replace-summary strong {
  font-size: 11px;
}

.confirm-row {
  margin: 18px 20px;
  align-items: flex-start;
}

.confirm-row p {
  margin: 1px 0 0;
  color: var(--text-soft);
  font-size: 10px;
  line-height: 1.5;
}

.confirmation-actions {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  background: var(--surface-soft);
}

/* Access */
.access-layout {
  display: grid;
  grid-template-columns: minmax(300px, 0.75fr) minmax(480px, 1.25fr);
  align-items: start;
  gap: 17px;
}

.grant-panel {
  overflow: hidden;
}

.grant-fields {
  display: grid;
  gap: 13px;
  padding: 18px 20px 0;
}

.grant-fields input,
.grant-fields select {
  padding: 0 12px;
  background: var(--surface-soft);
}

.two-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.add-room {
  width: 100%;
}

.mini-empty {
  margin: 14px 20px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 14px;
  color: var(--text-faint);
  background: var(--surface-soft);
  font-size: 9.5px;
}

.staging-list {
  margin: 14px 20px 0;
  display: grid;
  gap: 7px;
}

.staging-list > span {
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
}

.staging-list > div {
  display: grid;
  grid-template-columns: 1fr auto 25px;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
  background: var(--surface-soft);
  font-size: 9px;
}

.staging-list > div > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-soft);
}

.staging-list > div > strong {
  white-space: nowrap;
}

.staging-list button {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 6px;
  color: var(--text-faint);
  background: transparent;
}

.staging-list button:hover {
  color: var(--danger);
  background: var(--danger-soft);
}

.grant-panel .compact-alert {
  margin: 14px 20px 0;
}

.grant-submit {
  width: calc(100% - 40px);
  margin: 14px 20px 20px;
}

.active-access-panel {
  overflow: hidden;
}

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 6px 9px;
  color: var(--success);
  background: var(--success-soft);
  font-size: 9px;
  font-weight: 700;
}

.live-indicator i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
}

.access-list {
  display: grid;
}

.access-list article {
  display: grid;
  grid-template-columns: 36px minmax(140px, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  padding: 14px 17px;
}

.access-list article:last-child {
  border-bottom: 0;
}

.access-avatar {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  font-size: 9px;
}

.access-info {
  min-width: 0;
}

.access-info strong,
.access-info span,
.access-expiry small,
.access-expiry strong {
  display: block;
}

.access-info strong {
  overflow: hidden;
  margin-bottom: 4px;
  font-size: 10.5px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.access-info span {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-faint);
  font-size: 9px;
}

.access-expiry {
  text-align: right;
}

.access-expiry small {
  margin-bottom: 3px;
  color: var(--text-faint);
  font-size: 8px;
}

.access-expiry strong {
  font-size: 9px;
}

.revoke-button {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid color-mix(in srgb, var(--danger) 20%, var(--border));
  border-radius: 8px;
  padding: 0 9px;
  color: var(--danger);
  background: var(--danger-soft);
  font-size: 9px;
  font-weight: 700;
}

.revoke-button:hover {
  border-color: var(--danger);
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 100;
  min-width: 260px;
  max-width: min(420px, calc(100vw - 32px));
  display: flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text);
  background: var(--surface-raised);
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.18);
  font-size: 11px;
  font-weight: 650;
  animation: rise 220ms ease both;
}

.toast--success > svg { color: var(--success); }
.toast--error > svg { color: var(--danger); }
.toast--info > svg { color: var(--primary); }

.toast span {
  flex: 1;
}

.toast button {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 7px;
  color: var(--text-faint);
  background: transparent;
}

.toast button:hover {
  color: var(--text);
  background: var(--surface-soft);
}

.sidebar-backdrop {
  display: none;
}

@media (max-width: 1100px) {
  .mapping-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .field-grid--filter {
    grid-template-columns: 1.2fr 0.65fr 0.65fr;
  }

  .filter-submit {
    grid-column: 1 / -1;
    justify-self: end;
  }

  .access-layout {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 880px) {
  :root {
    --sidebar-width: 278px;
  }

  .sidebar {
    transform: translateX(-100%);
    box-shadow: 20px 0 60px rgba(0, 0, 0, 0.18);
  }

  .sidebar--open {
    transform: translateX(0);
  }

  .sidebar-close {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    color: var(--text-faint);
  }

  .sidebar-close:hover {
    color: var(--text);
    background: var(--surface-soft);
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    display: block;
    border: 0;
    background: rgba(8, 13, 24, 0.5);
    backdrop-filter: blur(2px);
  }

  .main-area {
    margin-left: 0;
  }

  .menu-button {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-soft);
    background: var(--surface);
  }

  .topbar-left {
    gap: 10px;
  }

  .mobile-title {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .mobile-title span {
    font-size: 12px;
    font-weight: 750;
  }

  .mobile-title small {
    color: var(--text-faint);
    font-size: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .login-layout {
    grid-template-columns: minmax(0, 1fr) minmax(340px, 0.8fr);
    gap: 44px;
  }

  .login-benefits {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .login-page {
    display: flex;
    min-height: 100svh;
    flex-direction: column;
    padding: 18px 16px 15px;
  }

  .login-layout {
    min-height: 0;
    margin: auto;
    grid-template-columns: 1fr;
  }

  .login-intro {
    display: none;
  }

  .login-card {
    width: min(420px, 100%);
    margin: 28px auto;
  }

  .login-footer {
    margin-top: auto;
  }

  .content-wrap {
    padding: 25px 16px 45px;
  }

  .topbar {
    height: 64px;
    padding: 0 16px;
  }

  .logout-top,
  .role-chip {
    display: none;
  }

  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  .section-action {
    width: 100%;
  }

  .section-action .secondary-button {
    width: 100%;
  }

  .search-panel {
    padding: 14px;
  }

  .search-field-large {
    min-height: 54px;
    padding: 0 13px;
  }

  .search-field-large input {
    font-size: 14px;
  }

  .search-field-large kbd {
    display: none;
  }

  .search-help {
    flex-direction: column;
    gap: 5px;
  }

  .result-toolbar {
    min-height: 62px;
    padding: 11px 13px;
  }

  .result-toolbar .secondary-button {
    min-height: 36px;
    padding: 0 10px;
    font-size: 10px;
  }

  .field-grid--filter {
    grid-template-columns: 1fr 1fr;
  }

  .field-grid--filter label:first-child {
    grid-column: 1 / -1;
  }

  .filter-submit {
    width: 100%;
  }

  .mapping-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .upload-stepper {
    grid-template-columns: 1fr 28px 1fr 28px 1fr;
  }

  .upload-stepper > div {
    justify-content: center;
  }

  .upload-stepper p {
    display: none;
  }

  .upload-stepper > i {
    margin: 0 5px;
  }

  .upload-dropzone {
    min-height: 270px;
  }

  .replace-summary {
    gap: 10px;
  }

  .replace-summary svg {
    width: 14px;
  }

  .confirmation-actions {
    flex-direction: column-reverse;
  }

  .confirmation-actions button {
    width: 100%;
  }

  .access-list article {
    grid-template-columns: 34px minmax(0, 1fr) auto;
  }

  .access-expiry {
    grid-column: 2;
    text-align: left;
  }

  .revoke-button {
    grid-column: 3;
    grid-row: 1 / span 2;
  }
}

@media (max-width: 520px) {
  .brand-copy strong {
    font-size: 13px;
  }

  .brand-copy span {
    font-size: 7.5px;
  }

  .login-topbar .brand-copy {
    display: none;
  }

  .login-card {
    border-radius: 16px;
    padding: 27px 20px;
  }

  .login-footer span {
    display: none;
  }

  .section-heading h1 {
    font-size: 27px;
  }

  .field-grid--filter {
    grid-template-columns: 1fr;
  }

  .field-grid--filter label:first-child {
    grid-column: auto;
  }

  .data-table-scroll {
    max-height: none;
    overflow: visible;
  }

  .data-table,
  .data-table thead,
  .data-table tbody,
  .data-table tr,
  .data-table td {
    display: block;
    width: 100%;
  }

  .data-table {
    min-width: 0;
    padding: 10px;
  }

  .data-table thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .data-table tbody {
    display: grid;
    gap: 9px;
  }

  .data-table tbody tr {
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 6px 0;
    background: var(--surface-soft);
  }

  .data-table td {
    position: relative;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    border: 0;
    padding: 7px 11px 7px 43%;
    text-align: right;
    white-space: normal;
  }

  .data-table td::before {
    content: attr(data-label);
    position: absolute;
    left: 11px;
    width: 36%;
    color: var(--text-faint);
    font-size: 8px;
    font-weight: 750;
    letter-spacing: 0.06em;
    text-align: left;
    text-transform: uppercase;
  }

  .data-table tbody tr:hover td {
    background: transparent;
  }

  .mapping-grid {
    grid-template-columns: 1fr;
  }

  .file-summary {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .file-summary > div:nth-child(2) {
    width: calc(100% - 60px);
  }

  .file-summary .secondary-button {
    width: 100%;
  }

  .panel-title {
    align-items: flex-start;
  }

  .panel-title > span {
    flex: 0 0 auto;
  }

  .danger-heading {
    align-items: flex-start;
  }

  .replace-summary {
    align-items: stretch;
    flex-direction: column;
  }

  .replace-summary svg {
    align-self: center;
    transform: rotate(90deg);
  }

  .two-fields {
    grid-template-columns: 1fr;
  }

  .staging-list > div {
    grid-template-columns: 1fr 25px;
  }

  .staging-list > div > strong {
    grid-column: 1;
    grid-row: 2;
  }

  .staging-list button {
    grid-column: 2;
    grid-row: 1 / span 2;
  }

  .access-list article {
    grid-template-columns: 34px minmax(0, 1fr);
  }

  .access-expiry {
    grid-column: 2;
  }

  .revoke-button {
    grid-column: 1 / -1;
    grid-row: auto;
    justify-content: center;
  }

  .toast {
    right: 16px;
    bottom: 16px;
    left: 16px;
    min-width: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
